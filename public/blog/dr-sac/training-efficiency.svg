<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" role="img" aria-labelledby="eff-title eff-desc">
  <title id="eff-title">Training time and inner optimization cost of DR-SAC versus DR-SAC-Accurate and RFQI</title>
  <desc id="eff-desc">Two-panel chart of exact numbers reported in Tables 1, 5, and 6 of the DR-SAC ICLR 2026 paper. Left: training wall time in minutes across Cartpole, LunarLander, and Reacher for SAC, DR-SAC, FQI, and RFQI (Table 1). Right: LunarLander inner gradient descent steps vs nominal return and training time for DR-SAC (5 GD steps, 36 min, return 240.0) compared to RFQI at 5, 10, 100, and 1000 GD steps (Table 6).</desc>
  <style>
    .bg { fill: #fffdf7; }
    .header-bar { fill: #e8e1d1; stroke: #222a24; stroke-width: 2; }
    .panel-box { fill: #faf6eb; stroke: #222a24; stroke-width: 1.5; }
    .panel-label { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: #1f6b4f; letter-spacing: 0.07em; }
    .panel-title { font-family: 'Newsreader', Georgia, serif; font-size: 15px; font-weight: 700; fill: #1c211d; }
    .mono { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10.8px; fill: #1c211d; }
    .mono-muted { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10px; fill: #495148; }
    .mono-bold { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10.8px; font-weight: 600; fill: #1c211d; }
    .bar-sac { fill: #b8c4b9; stroke: #222a24; stroke-width: 1; }
    .bar-drsac { fill: #1f6b4f; stroke: #222a24; stroke-width: 1; }
    .bar-fqi { fill: #f0c35a; stroke: #222a24; stroke-width: 1; }
    .bar-rfqi { fill: #bd5b4a; stroke: #222a24; stroke-width: 1; }
    .grid { stroke: #ded7c5; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <rect class="bg" x="0" y="0" width="920" height="350" />

  <!-- Top window bar -->
  <rect class="header-bar" x="1" y="1" width="918" height="36" />
  <rect x="14" y="14" width="9" height="9" fill="#bd5b4a" stroke="#222a24" stroke-width="1" />
  <rect x="29" y="14" width="9" height="9" fill="#f0c35a" stroke="#222a24" stroke-width="1" />
  <rect x="44" y="14" width="9" height="9" fill="#1f6b4f" stroke="#222a24" stroke-width="1" />
  <text x="66" y="23" class="mono-bold">COMPUTE ACCOUNTING / WALL TIME &amp; INNER DUAL CONVERGENCE (PAPER TABLES 1, 5, 6)</text>

  <!-- ==================== LEFT PANEL: TABLE 1 ==================== -->
  <rect class="panel-box" x="22" y="52" width="432" height="278" />
  <text x="36" y="72" class="panel-label">PANEL A / TRAINING WALL TIME (MINUTES, TABLE 1)</text>
  <text x="36" y="91" class="panel-title">DR-SAC stays within 2.0×2.5× of SAC; RFQI costs up to 23.2× DR-SAC</text>

  <!-- Legend -->
  <rect class="bar-sac" x="36" y="103" width="11" height="11" />
  <text x="52" y="112" class="mono-muted">SAC</text>
  <rect class="bar-drsac" x="92" y="103" width="11" height="11" />
  <text x="108" y="112" class="mono-bold">DR-SAC</text>
  <rect class="bar-fqi" x="168" y="103" width="11" height="11" />
  <text x="184" y="112" class="mono-muted">FQI</text>
  <rect class="bar-rfqi" x="224" y="103" width="11" height="11" />
  <text x="240" y="112" class="mono-muted">RFQI (TV-dual)</text>

  <!-- Scale: max = 250 min -> 260 px (from x=128 to x=388; 1 min = 1.04 px) -->
  <line class="grid" x1="128" y1="124" x2="128" y2="306" />
  <line class="grid" x1="232" y1="124" x2="232" y2="306" />
  <line class="grid" x1="336" y1="124" x2="336" y2="306" />
  <text x="128" y="320" class="mono-muted" text-anchor="middle">0m</text>
  <text x="232" y="320" class="mono-muted" text-anchor="middle">100m</text>
  <text x="336" y="320" class="mono-muted" text-anchor="middle">200m</text>

  <!-- Cartpole group -->
  <text x="120" y="152" class="mono-bold" text-anchor="end">Cartpole</text>
  <rect class="bar-sac" x="128" y="128" width="3" height="11" />
  <text x="136" y="137" class="mono-muted">2m</text>
  <rect class="bar-drsac" x="128" y="141" width="5" height="11" />
  <text x="138" y="150" class="mono-bold">4m</text>
  <rect class="bar-fqi" x="128" y="154" width="8" height="11" />
  <text x="141" y="163" class="mono-muted">7m</text>
  <rect class="bar-rfqi" x="128" y="167" width="97" height="11" />
  <text x="230" y="176" class="mono-bold">93m (23.25× DR-SAC)</text>

  <!-- LunarLander group -->
  <text x="120" y="214" class="mono-bold" text-anchor="end">LunarLander</text>
  <rect class="bar-sac" x="128" y="190" width="17" height="11" />
  <text x="150" y="199" class="mono-muted">16m</text>
  <rect class="bar-drsac" x="128" y="203" width="37" height="11" />
  <text x="170" y="212" class="mono-bold">36m</text>
  <rect class="bar-fqi" x="128" y="216" width="18" height="11" />
  <text x="151" y="225" class="mono-muted">17m</text>
  <rect class="bar-rfqi" x="128" y="229" width="248" height="11" />
  <text x="381" y="238" class="mono-bold">238m (6.61×)</text>

  <!-- Reacher group -->
  <text x="120" y="276" class="mono-bold" text-anchor="end">Reacher</text>
  <rect class="bar-sac" x="128" y="252" width="14" height="11" />
  <text x="147" y="261" class="mono-muted">13m</text>
  <rect class="bar-drsac" x="128" y="265" width="33" height="11" />
  <text x="166" y="274" class="mono-bold">32m</text>
  <rect class="bar-fqi" x="128" y="278" width="15" height="11" />
  <text x="148" y="287" class="mono-muted">14m</text>
  <rect class="bar-rfqi" x="128" y="291" width="165" height="11" />
  <text x="298" y="300" class="mono-bold">159m (4.97×)</text>

  <!-- ==================== RIGHT PANEL: TABLES 5 & 6 ==================== -->
  <rect class="panel-box" x="466" y="52" width="432" height="278" />
  <text x="480" y="72" class="panel-label">PANEL B / INNER DUAL STEPS IN LUNARLANDER (TABLE 6)</text>
  <text x="480" y="91" class="panel-title">5 GD steps suffice for DR-SAC; RFQI degrades below 1,000 steps</text>

  <!-- Scale for Nominal Return: 0 to 250 -> 220 px (from x=612 to x=832; 1 unit = 0.88 px) -->
  <text x="612" y="114" class="mono-muted">Nominal LunarLander return (higher is better; wall time at right)</text>
  <line class="grid" x1="612" y1="124" x2="612" y2="250" />
  <line class="grid" x1="700" y1="124" x2="700" y2="250" />
  <line class="grid" x1="788" y1="124" x2="788" y2="250" />

  <!-- Row 1: DR-SAC (5 GD) -->
  <text x="604" y="141" class="mono-bold" text-anchor="end">DR-SAC (5 GD)</text>
  <rect class="bar-drsac" x="612" y="130" width="211" height="15" />
  <text x="829" y="141" class="mono-bold">240.0 (36m)</text>

  <!-- Row 2: RFQI (5 GD) -->
  <text x="604" y="166" class="mono-muted" text-anchor="end">RFQI (5 GD)</text>
  <rect class="bar-rfqi" x="612" y="155" width="155" height="15" opacity="0.65" />
  <text x="773" y="166" class="mono-muted">175.9 (12m)</text>

  <!-- Row 3: RFQI (10 GD) -->
  <text x="604" y="191" class="mono-muted" text-anchor="end">RFQI (10 GD)</text>
  <rect class="bar-rfqi" x="612" y="180" width="160" height="15" opacity="0.75" />
  <text x="778" y="191" class="mono-muted">181.9 (21m)</text>

  <!-- Row 4: RFQI (100 GD) -->
  <text x="604" y="216" class="mono-muted" text-anchor="end">RFQI (100 GD)</text>
  <rect class="bar-rfqi" x="612" y="205" width="170" height="15" opacity="0.88" />
  <text x="788" y="216" class="mono-muted">192.9 (139m)</text>

  <!-- Row 5: RFQI (1000 GD, default) -->
  <text x="604" y="241" class="mono-bold" text-anchor="end">RFQI (1000 GD)</text>
  <rect class="bar-rfqi" x="612" y="230" width="177" height="15" />
  <text x="795" y="241" class="mono-bold">201.2 (238m)</text>

  <!-- Callout box at bottom of Panel B for Table 5 (Pendulum Accurate vs Functional) -->
  <rect x="480" y="260" width="404" height="56" fill="#eef5f0" stroke="#1f6b4f" stroke-width="1.25" />
  <text x="490" y="277" class="panel-label">PENDULUM ABLATION / FUNCTIONAL VS. EXACT DUAL (TABLE 5)</text>
  <text x="490" y="294" class="mono">SAC (10k): 1.7m  ·  DR-SAC-Functional (10k): 4.7m  ·  DR-SAC-Accurate (8k): 260m</text>
  <text x="490" y="309" class="mono-muted">Functional dual uses &lt;2% of per-(s,a) SciPy time with matching or better return.</text>
</svg>
