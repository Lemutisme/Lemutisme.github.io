<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-labelledby="title desc">
  <title id="title">From intractable worst-case transition kernels to DR-SAC's offline actor-critic backup</title>
  <desc id="desc">Three-stage reduction in DR-SAC: (1) KL strong duality collapses the infinite-dimensional inner infimum over transition kernels to a 1D scalar search over beta under the nominal distribution; (2) Rockafellar-Wets decomposable interchange replaces per-(s,a) scalar solves with a shared dual network G_eta updated in 5 gradient steps; (3) a conditional transition VAE draws m next-state samples per (s,a) to prevent the m=1 log-exp cancellation that collapses naive offline ERM to non-robust SAC.</desc>
  <style>
    .bg { fill: #fffdf7; }
    .header-bar { fill: #e8e1d1; stroke: #222a24; stroke-width: 2; }
    .stage-num { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; font-weight: 600; fill: #1f6b4f; letter-spacing: 0.08em; }
    .stage-title { font-family: 'Newsreader', Georgia, serif; font-size: 16px; font-weight: 700; fill: #1c211d; }
    .box-obstruction { fill: #fbf4f1; stroke: #bd5b4a; stroke-width: 1.75; }
    .box-solution { fill: #eef5f0; stroke: #1f6b4f; stroke-width: 2; }
    .badge-red { fill: #bd5b4a; }
    .badge-green { fill: #1f6b4f; }
    .badge-text { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10px; font-weight: 600; fill: #fffdf7; letter-spacing: 0.06em; }
    .mono { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11.2px; fill: #1c211d; }
    .mono-muted { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10.8px; fill: #495148; }
    .mono-bold { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11.2px; font-weight: 600; fill: #1c211d; }
    .math-eq { font-family: 'Newsreader', Georgia, 'Times New Roman', serif; font-size: 15px; font-weight: 600; fill: #1c211d; }
    .it { font-style: italic; }
    .sub { font-size: 10.5px; }
    .arrow-line { stroke: #1f6b4f; stroke-width: 2.2; fill: none; }
    .arrow-head { fill: #1f6b4f; }
    .arrow-label { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 10px; font-weight: 600; fill: #1f6b4f; text-anchor: middle; }
    .divider { stroke: #d8d0be; stroke-width: 1; stroke-dasharray: 4 4; }
  </style>

  <rect class="bg" x="0" y="0" width="920" height="560" />

  <!-- Top window bar -->
  <rect class="header-bar" x="1" y="1" width="918" height="36" />
  <rect x="14" y="14" width="9" height="9" fill="#bd5b4a" stroke="#222a24" stroke-width="1" />
  <rect x="29" y="14" width="9" height="9" fill="#f0c35a" stroke="#222a24" stroke-width="1" />
  <rect x="44" y="14" width="9" height="9" fill="#1f6b4f" stroke="#222a24" stroke-width="1" />
  <text x="66" y="23" class="mono-bold">DR-SAC / THREE REDUCTIONS FROM ROBUST MDP TO OFFLINE CONTINUOUS CONTROL</text>
  <text x="904" y="23" class="mono-muted" text-anchor="end">ICLR 2026</text>

  <!-- ==================== STAGE 1 ==================== -->
  <text x="26" y="64" class="stage-num">01 / MEASURE SPACE TO SCALAR DUAL (PROPOSITION 3.3)</text>
  <text x="26" y="84" class="stage-title">KL strong duality eliminates the adversarial transition kernel</text>

  <!-- Left box 1 -->
  <rect class="box-obstruction" x="26" y="96" width="364" height="96" />
  <rect class="badge-red" x="26" y="96" width="176" height="20" />
  <text x="34" y="110" class="badge-text">PRIMAL BACKUP (EQ. 10)</text>
  <text x="40" y="139" class="math-eq">inf<tspan dy="4" class="sub"><tspan class="it">p</tspan> &#8712; <tspan class="it">P</tspan><tspan dy="2" font-size="8.5">s,a</tspan><tspan dy="-2">(&#948;)</tspan></tspan><tspan dy="-4">  E</tspan><tspan dy="4" class="sub"><tspan class="it">s'</tspan> &#8764; <tspan class="it">p</tspan>(&#183; | <tspan class="it">s,a</tspan>)</tspan><tspan dy="-4"> [ <tspan class="it">V</tspan>(<tspan class="it">s'</tspan>) ]</tspan></text>
  <text x="40" y="162" class="mono-muted">Search space: all transition kernels p<tspan dy="3" font-size="8.5">s,a</tspan><tspan dy="-3"> &#8712; &#916;(S)</tspan></text>
  <text x="40" y="179" class="mono-muted">satisfying D<tspan dy="3" font-size="8.5">KL</tspan><tspan dy="-3">(p</tspan><tspan dy="3" font-size="8.5">s,a</tspan><tspan dy="-3"> &#8214; p</tspan><tspan dy="-4" font-size="8.5">0</tspan><tspan dy="7" font-size="8.5">s,a</tspan><tspan dy="-3">) &#8804; &#948;  (infinite-dim)</tspan></text>

  <!-- Arrow 1 -->
  <text x="448" y="131" class="arrow-label">KL DUALITY</text>
  <text x="448" y="144" class="mono-muted" text-anchor="middle" style="font-size:9.5px;">Hu &amp; Hong (2013)</text>
  <line class="arrow-line" x1="398" y1="152" x2="490" y2="152" />
  <polygon class="arrow-head" points="498,152 488,147 488,157" />

  <!-- Right box 1 -->
  <rect class="box-solution" x="506" y="96" width="388" height="96" />
  <rect class="badge-green" x="506" y="96" width="184" height="20" />
  <text x="514" y="110" class="badge-text">DUAL OPERATOR (EQ. 11)</text>
  <text x="520" y="139" class="math-eq">sup<tspan dy="4" class="sub">&#946; &#8805; 0</tspan><tspan dy="-4"> [ &#8722;&#946; log E</tspan><tspan dy="4" class="sub"><tspan class="it">p</tspan><tspan dy="-4" font-size="8">0</tspan><tspan dy="6" font-size="8.5">s,a</tspan></tspan><tspan dy="-6"> ( exp(&#8722;<tspan class="it">V</tspan>(<tspan class="it">s'</tspan>) / &#946;) ) &#8722; &#946;&#948; ]</tspan></text>
  <text x="520" y="162" class="mono">1D concave search over scalar temperature &#946; &#8805; 0</text>
  <text x="520" y="179" class="mono-muted">Expectation uses ONLY nominal kernel p<tspan dy="-4" font-size="8.5">0</tspan><tspan dy="7" font-size="8.5">s,a</tspan><tspan dy="-3">; &#947;-contraction</tspan></text>

  <line class="divider" x1="26" y1="208" x2="894" y2="208" />

  <!-- ==================== STAGE 2 ==================== -->
  <text x="26" y="232" class="stage-num">02 / POINTWISE SOLVES TO SHARED FUNCTION SPACE (PROPOSITION 3.7)</text>
  <text x="26" y="252" class="stage-title">Decomposable interchange replaces per-(s,a) inner loops with a 5-step dual network</text>

  <!-- Left box 2 -->
  <rect class="box-obstruction" x="26" y="264" width="364" height="102" />
  <rect class="badge-red" x="26" y="264" width="212" height="20" />
  <text x="34" y="278" class="badge-text">PER-(S,A) INNER SOLVE (TABLE 5)</text>
  <text x="40" y="306" class="math-eq">E<tspan dy="4" class="sub">(<tspan class="it">s,a</tspan>) &#8764; <tspan class="it">D</tspan></tspan><tspan dy="-4"> [ sup</tspan><tspan dy="4" class="sub">&#946; &#8805; 0</tspan><tspan dy="-4"> <tspan class="it">f</tspan>((<tspan class="it">s,a</tspan>), &#946;) ]</tspan></text>
  <text x="40" y="328" class="mono-muted">Separate 1D SciPy optimization at every (s,a) in batch</text>
  <text x="40" y="345" class="mono-bold">Pendulum (8k steps): 260 min  (&gt;150&#215; SAC's 1.7 min)</text>
  <text x="40" y="360" class="mono-muted">RFQI functional inner loop: 1,000 GD steps / update</text>

  <!-- Arrow 2 -->
  <text x="448" y="302" class="arrow-label">L&#185; INTERCHANGE</text>
  <text x="448" y="315" class="mono-muted" text-anchor="middle" style="font-size:9.5px;">g(s,a) &#8712; [0, V<tspan dy="2" font-size="7.5">max</tspan><tspan dy="-2"> / &#948;]</tspan></text>
  <line class="arrow-line" x1="398" y1="323" x2="490" y2="323" />
  <polygon class="arrow-head" points="498,323 488,318 488,328" />

  <!-- Right box 2 -->
  <rect class="box-solution" x="506" y="264" width="388" height="102" />
  <rect class="badge-green" x="506" y="264" width="224" height="20" />
  <text x="514" y="278" class="badge-text">FUNCTIONAL DUAL (EQ. 17&#8211;18, 22)</text>
  <text x="520" y="306" class="math-eq">sup<tspan dy="4" class="sub"><tspan class="it">g</tspan> &#8712; <tspan class="it">G</tspan><tspan dy="2" font-size="8.5">&#951;</tspan></tspan><tspan dy="-6">  E</tspan><tspan dy="4" class="sub">(<tspan class="it">s,a</tspan>) &#8764; <tspan class="it">D</tspan></tspan><tspan dy="-4"> [ <tspan class="it">f</tspan>((<tspan class="it">s,a</tspan>), <tspan class="it">g</tspan>(<tspan class="it">s,a</tspan>)) ]</tspan></text>
  <text x="520" y="328" class="mono">Shared network g<tspan dy="3" font-size="8.5">&#951;</tspan><tspan dy="-3">(s,a) trained jointly across batch</tspan></text>
  <text x="520" y="345" class="mono-bold">Pendulum (10k steps): 4.7 min (&lt;2% of Accurate; 5 GD steps)</text>
  <text x="520" y="360" class="mono-muted">4.97&#215;&#8211;23.25&#215; faster than RFQI across benchmarks (Table 1)</text>

  <line class="divider" x1="26" y1="382" x2="894" y2="382" />

  <!-- ==================== STAGE 3 ==================== -->
  <text x="26" y="406" class="stage-num">03 / OFFLINE DOUBLE-SAMPLING TRAP TO GENERATIVE TRANSITIONS (SECTION 3.2 &amp; APPENDIX A.1)</text>
  <text x="26" y="426" class="stage-title">A conditional transition VAE prevents log-exp cancellation on continuous datasets</text>

  <!-- Left box 3 -->
  <rect class="box-obstruction" x="26" y="438" width="364" height="102" />
  <rect class="badge-red" x="26" y="438" width="218" height="20" />
  <text x="34" y="452" class="badge-text">SINGLE-SAMPLE ERM TRAP (EQ. 24)</text>
  <text x="40" y="480" class="math-eq">&#8722;<tspan class="it">g</tspan> log( exp(&#8722;<tspan class="it">V</tspan>(<tspan class="it">s'</tspan><tspan dy="4" class="sub"><tspan class="it">i</tspan></tspan><tspan dy="-4">) / <tspan class="it">g</tspan>) ) &#8722; <tspan class="it">g</tspan>&#948;  =  <tspan class="it">V</tspan>(<tspan class="it">s'</tspan></tspan><tspan dy="4" class="sub"><tspan class="it">i</tspan></tspan><tspan dy="-4">) &#8722; <tspan class="it">g</tspan>&#948;</tspan></text>
  <text x="40" y="502" class="mono-muted">Continuous S &#215; A: each (s<tspan dy="3" font-size="8.5">i</tspan><tspan dy="-3">, a</tspan><tspan dy="3" font-size="8.5">i</tspan><tspan dy="-3">) visited once (m = 1)</tspan></text>
  <text x="40" y="519" class="mono-bold">log and exp cancel  &#8594;  optimal g*(s,a) = 0 everywhere</text>
  <text x="40" y="534" class="mono-muted">Robust backup degenerates into non-robust nominal SAC</text>

  <!-- Arrow 3 -->
  <text x="448" y="476" class="arrow-label">VAE + V-CRITIC</text>
  <text x="448" y="489" class="mono-muted" text-anchor="middle" style="font-size:9.5px;">m synthetic draws</text>
  <line class="arrow-line" x1="398" y1="497" x2="490" y2="497" />
  <polygon class="arrow-head" points="498,497 488,492 488,502" />

  <!-- Right box 3 -->
  <rect class="box-solution" x="506" y="438" width="388" height="102" />
  <rect class="badge-green" x="506" y="438" width="236" height="20" />
  <text x="514" y="452" class="badge-text">EMPIRICAL DR BACKUP (EQ. 19&#8211;20)</text>
  <text x="520" y="480" class="math-eq">&#8722;<tspan class="it">g</tspan> log( (1/<tspan class="it">m</tspan>) &#8721;<tspan dy="4" class="sub"><tspan class="it">i</tspan>=1..<tspan class="it">m</tspan></tspan><tspan dy="-4"> exp(&#8722;<tspan class="it">V</tspan></tspan><tspan dy="4" class="sub">target</tspan><tspan dy="-4">(<tspan class="it">s'</tspan></tspan><tspan dy="4" class="sub"><tspan class="it">i</tspan></tspan><tspan dy="-4">) / <tspan class="it">g</tspan>) ) &#8722; <tspan class="it">g</tspan>&#948;</tspan></text>
  <text x="520" y="502" class="mono">VAE draws m synthetic next states s'<tspan dy="3" font-size="8.5">1..m</tspan><tspan dy="-3"> around each (s,a)</tspan></text>
  <text x="520" y="519" class="mono-bold">Explicit target V-network scores m next states directly</text>
  <text x="520" y="534" class="mono-muted">4.5&#215;+ faster than diffusion; stable on TD3 &amp; SAC offline data</text>
</svg>
